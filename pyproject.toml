[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare-publish"
version = "0.3.2"
description = "macOS CLI for publishing local HTTP(S) and SSH services through Cloudflare Tunnel and Access."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tiziano Contorno" }]
dependencies = []

[project.scripts]
cloudflare-publish = "cloudflare_publish.cli:entrypoint"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
stubPath = "typings"
include = [
  "src",
  "devtools",
  "tests/fake_curl_script.py",
  "tests/fake_environment.py",
  "tests/fake_tool_scripts.py",
  "tests/test_http.py",
  "tests/test_keychain.py",
  "tests/test_local_secrets.py",
  "tests/test_service_flow.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "darwin: tests that require macOS-only tooling",
  "live: tests that require real local or remote infrastructure",
]
